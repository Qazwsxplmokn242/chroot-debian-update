name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  my_job:
    name: CHROOT UPDATE DEBIAN 
    runs-on: ubuntu-latest

    steps:
    - name: debian update
      shell: bash
      run: |
       CROSS_ROOT="/mnt/chroot-debian"
       CROSS_MIRROR="http://deb.debian.org/debian/"
       
       sudo apt-get -y install debootstrap -y

       sudo mkdir -p $CROSS_ROOT
       sudo debootstrap --arch=amd64 stable $CROSS_ROOT $CROSS_MIRROR
       
       sudo mount -t proc /proc /mnt/chroot-debian/proc
       sudo mount -t sysfs /sys /mnt/chroot-debian/sys
       sudo mount --bind /dev /mnt/chroot-debian/dev
       sudo mount --bind /dev/pts /mnt/chroot-debian/dev/pts

       sudo chroot /mnt/chroot-debian /bin/bash
